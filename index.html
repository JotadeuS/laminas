<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Álbum Mundial 2026 - Tracker Profesional</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-body: #050505; 
            --bg-color: #0b0c10;
            --surface: #1f2833;
            --surface-alt: #000000;
            --primary: #45a29e;
            --accent: #66fcf1;
            --danger: #ff004c;
            --success: #00e676;
            --text-dim: #94a3b8;
            --white: #ffffff;
            --gold: #FFD700;
            --gold-gradient: linear-gradient(135deg, #FFD700 0%, #FDB931 50%, #FFD700 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { 
            background-color: var(--bg-body); 
            color: var(--text-dim); 
        }

        /* Fondo difuminado permanente */
        body::before {
            content: '';
            position: fixed;
            top: -20px; 
            left: -20px; 
            right: -20px; 
            bottom: -20px; 
            background-image: url('./fondo.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(12px); 
            z-index: -2;
        }
        
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4); 
            z-index: -1;
        }

        .app-container {
            width: 100%; /* Garantiza 100% de responsividad en móviles extraños */
            max-width: 650px; 
            margin: 0 auto;
            background-color: rgba(11, 12, 16, 0.85); 
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            min-height: 100vh;
            position: relative;
            padding-bottom: 50px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        /* HEADER */
        .header { 
            background: #000000; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.9); 
            border-bottom: 2px solid var(--gold); 
        }
        
        .header-top {
            padding: 10px 15px; 
        }

        /* Logo y Título CENTRADOS */
        .brand-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px; 
            flex-wrap: nowrap; 
            white-space: nowrap; 
        }

        .logo-img {
            max-height: 150px; 
            mix-blend-mode: screen; 
            display: block;
            filter: brightness(1.1);
        }

        .main-title {
            color: var(--white);
            font-size: 1.8rem; 
            font-weight: 800;
            text-transform: uppercase;
            line-height: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .gold-text {
            display: inline-block; 
            font-size: 2.2rem; 
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            animation: gold-shimmer 3s infinite linear;
            background-size: 200% auto;
        }
        
        @keyframes gold-shimmer { to { background-position: 200% center; } }
        
        /* ESTADÍSTICAS EXACTAS */
        .stats-container { 
            display: flex; 
            justify-content: space-between; 
            text-align: center; 
            background: #12181f; 
            border: 1px solid var(--gold); 
            border-radius: 8px; 
            padding: 8px 5px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            margin-bottom: 5px;
        }
        
        .stat-box { flex: 1; }
        .stat-value { font-size: 1.5rem; font-weight: 900; color: var(--white); } 
        .stat-value.faltantes { color: var(--danger); } 
        .stat-value.pegadas { color: var(--success); } 
        .stat-value.repetidas-stat { color: var(--accent); } 
        .stat-label { font-size: 0.65rem; text-transform: uppercase; color: var(--gold); letter-spacing: 1px; margin-top: 2px; font-weight: 800; }

        /* TABS EXACTOS */
        .tabs { display: flex; background: #08090c; } 
        .tab { flex: 1; padding: 10px; text-align: center; font-weight: 600; color: #777; cursor: pointer; border-bottom: 4px solid transparent; transition: all 0.3s ease; text-transform: uppercase; font-size: 0.95rem; letter-spacing: 1px; } 
        .tab.active { color: var(--gold); border-bottom: 4px solid var(--gold); background: rgba(255, 215, 0, 0.08); }

        /* BUSCADOR ESTÁTICO */
        .search-box {
            padding: 10px 15px 15px 15px;
            background: #08090c; 
        }
        #search-input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--gold);
            background: rgba(11, 12, 16, 0.9);
            color: var(--white);
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }
        #search-input:focus {
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
            background: #000;
        }
        #search-input::placeholder {
            color: #777;
        }

        /* Contenedor del sistema */
        .section-content { 
            display: none; 
            padding: 15px; 
            margin: 15px; 
            border: 1px solid var(--gold); 
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
        }
        
        .section-content.active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ACORDEONES */
        .accordion { background: var(--surface); border-radius: 6px; margin-bottom: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .accordion-header { padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; color: var(--white); font-weight: 600; background: linear-gradient(180deg, var(--surface) 0%, #161c24 100%); font-size: 0.9rem; }
        .accordion-header:active { background: #161c24; }
        .accordion-body { padding: 15px; display: none; border-top: 1px solid rgba(255,255,255,0.05); background: var(--bg-color); }
        .accordion.open .accordion-body { display: block; }
        .accordion.open .accordion-header .icon { transform: rotate(180deg); color: var(--gold); }
        .icon { transition: transform 0.3s ease; font-size: 0.9rem; }

        /* Grid Mi Álbum */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(45px, 1fr)); gap: 8px; }
        
        .lamina { 
            aspect-ratio: 1; 
            background: #11141a; 
            border-radius: 4px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 2px;
            font-size: 0.75rem; 
            font-weight: 600; 
            line-height: 1.1;
            cursor: pointer; 
            transition: all 0.2s ease; 
            border: 1px solid rgba(102, 252, 243, 0.3); 
            user-select: none; 
            color: #888; 
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5); 
        }
        
        .lamina.pegada { background: var(--accent); color: #000; border-color: #fff; box-shadow: 0 0 10px rgba(102, 252, 241, 0.4); }
        .lamina.locked { cursor: not-allowed; opacity: 0.8; }

        /* LÁMINA HOLOGRÁFICA */
        .lamina.holo { position: relative; overflow: hidden; color: #ffd700; border: 1px solid #ffd700; }
        .lamina.holo::after { 
            content: ''; 
            position: absolute; 
            top: 0; 
            left: -100%; 
            width: 100%; 
            height: 100%; 
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); 
            transform: skewX(-25deg); 
            animation: shine 3.5s infinite; 
        }
        .lamina.holo.pegada { background: var(--gold-gradient); color: #000; border-color: #fff; box-shadow: 0 0 10px rgba(255, 215, 0, 0.6); }

        @keyframes shine { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }

        /* Grid Repetidas */
        .grid-rep { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }

        .rep-item { background: #161c24; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
        .rep-name { font-size: 0.85rem; font-weight: 600; color: var(--white); text-align: center; }
        .rep-name.holo-text { color: #ffd700; }
        
        .controls { 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            width: 100%;
            background: #0b0c10; 
            padding: 5px; 
            border-radius: 20px; 
            border: 1px solid rgba(102, 252, 241, 0.1);
        }
        
        .btn-ctrl { 
            background: #2a3644; 
            color: white; 
            border: none; 
            width: 28px; 
            height: 28px; 
            border-radius: 50%; 
            font-size: 1.2rem; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            transition: background 0.2s, transform 0.1s;
        }
        
        .btn-ctrl.add { background: var(--primary); color: black; }
        .btn-ctrl.sub { background: var(--surface); color: white; }
        .btn-ctrl:active { transform: scale(0.9); }
        .btn-ctrl.sub.locked { opacity: 0.3; cursor: not-allowed; background: #333; color: #555; }
        
        .rep-count { font-weight: 800; font-size: 1rem; text-align: center; color: var(--white); flex-grow: 1; }
        .country-title { width: 100%; grid-column: 1 / -1; font-size: 0.9rem; color: var(--gold); margin-top: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; font-weight: 600; }

        /* Botones de Acción */
        .action-btns-container { display: flex; justify-content: center; gap: 15px; margin: 30px 0 10px 0; }
        .btn-action { 
            border: none; 
            padding: 12px 20px; 
            font-size: 0.95rem; 
            font-weight: 900; 
            font-family: 'Poppins', sans-serif; 
            border-radius: 30px; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: transform 0.2s ease, box-shadow 0.2s ease; 
        }
        .btn-save { background: var(--gold-gradient); color: #000; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3); }
        .btn-save:active { transform: scale(0.95); box-shadow: 0 2px 5px rgba(255, 215, 0, 0.4); }
        
        .btn-clear { background: #1f2833; color: var(--white); border: 1px solid #555; }
        .btn-clear:active { transform: scale(0.95); }

        /* MODAL POP-UP TEMÁTICO */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        
        .modal-box {
            background: rgba(17, 20, 26, 0.95);
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 25px 20px;
            width: 85%; max-width: 350px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(255, 215, 0, 0.2);
            transform: translateY(-20px); transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-box { transform: translateY(0); }
        
        .modal-icon { font-size: 3rem; margin-bottom: 15px; }
        .modal-icon.success { color: var(--success); }
        .modal-icon.warning { color: var(--gold); }
        
        .modal-title { color: var(--white); font-size: 1.2rem; font-weight: 800; margin-bottom: 10px; text-transform: uppercase; }
        .modal-message { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 25px; line-height: 1.4; }
        
        .modal-buttons { display: flex; justify-content: center; gap: 10px; }
        .modal-btn {
            background: var(--gold-gradient); color: #000; border: none;
            padding: 10px 20px; font-size: 0.95rem; font-weight: 800;
            border-radius: 20px; cursor: pointer; text-transform: uppercase;
            font-family: 'Poppins', sans-serif;
            transition: transform 0.2s;
        }
        .modal-btn.cancel { background: #333; color: white; border: 1px solid #555; background-image: none; }
        .modal-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="header-top">
                <div class="brand-row">
                    <img src="logo.jpg" alt="Logo Mundial 2026 Pro" class="logo-img">
                    <div class="main-title">
                        Láminas Mundial <span class="gold-text">2026</span>
                    </div>
                </div>
                
                <div class="stats-container">
                    <div class="stat-box">
                        <div class="stat-value" id="porcentaje">0.0%</div>
                        <div class="stat-label">Completado</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value pegadas" id="pegadas">0</div>
                        <div class="stat-label">Pegadas</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value faltantes" id="faltantes">980</div>
                        <div class="stat-label">Faltantes</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value repetidas-stat" id="total-repetidas">0</div>
                        <div class="stat-label">Repetidas</div>
                    </div>
                </div>
            </div>
            
            <div class="tabs">
                <div class="tab active" onclick="switchTab('coleccion', this)">Mi Álbum</div>
                <div class="tab" onclick="switchTab('repetidas', this)">Repetidas</div>
            </div>

            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 Buscar país, grupo o especial..." onkeyup="ejecutarBuscador()">
            </div>
        </div>

        <div id="coleccion" class="section-content active"></div>
        <div id="repetidas" class="section-content"></div>
    </div>

    <div class="modal-overlay" id="custom-modal">
        <div class="modal-box">
            <div class="modal-icon" id="modal-icon"><i class="fas fa-check-circle"></i></div>
            <div class="modal-title" id="modal-title">Título</div>
            <div class="modal-message" id="modal-message">Mensaje</div>
            <div class="modal-buttons" id="modal-buttons">
                </div>
        </div>
    </div>

    <script>
        // === 1. CONFIGURACIÓN FIREBASE ===
        const firebaseConfig = {
            apiKey: "AIzaSyBnRBx_atdwcQ_9yYib6FfWc6GfothCOTw",
            authDomain: "laminas-454dc.firebaseapp.com",
            databaseURL: "https://laminas-454dc-default-rtdb.firebaseio.com",
            projectId: "laminas-454dc",
            storageBucket: "laminas-454dc.firebasestorage.app",
            messagingSenderId: "280142270272",
            appId: "1:280142270272:web:a5470c91d1ef507e68f4a5",
            measurementId: "G-K0YKV1H2EE"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let usuarioId = localStorage.getItem('wc26_user_id');
        if (!usuarioId) {
            usuarioId = 'user_' + Math.random().toString(36).substring(2, 11);
            localStorage.setItem('wc26_user_id', usuarioId);
        }

        // === 2. VARIABLES DE DATOS ===
        const TOTAL_ALBUM = 980;
        const especiales = ["00", ...Array.from({length: 17}, (_, i) => `FWC ${i+1}`)];
        const cocaCola = Array.from({length: 14}, (_, i) => `CC ${i+1}`);
        
        const grupos = {
            "Grupo A": ["México 🇲🇽", "Sudáfrica 🇿🇦", "República de Corea 🇰🇷", "República Checa 🇨🇿"],
            "Grupo B": ["Canadá 🇨🇦", "Bosnia y Herzegovina 🇧🇦", "Qatar 🇶🇦", "Suiza 🇨🇭"],
            "Grupo C": ["Brasil 🇧🇷", "Marruecos 🇲🇦", "Haití 🇭🇹", "Escocia 🏴󠁧󠁢󠁳󠁣󠁴󠁿"],
            "Grupo D": ["Estados Unidos 🇺🇸", "Paraguay 🇵🇾", "Australia 🇦🇺", "Turquía 🇹🇷"],
            "Grupo E": ["Alemania 🇩🇪", "Curazao 🇨🇼", "Costa de Marfil 🇨🇮", "Ecuador 🇪🇨"],
            "Grupo F": ["Países Bajos 🇳🇱", "Japón 🇯🇵", "Suecia 🇸🇪", "Túnez 🇹🇳"],
            "Grupo G": ["Bélgica 🇧🇪", "Egipto 🇪🇬", "Irán 🇮🇷", "Nueva Zelanda 🇳🇿"],
            "Grupo H": ["España 🇪🇸", "Cabo Verde 🇨🇻", "Arabia Saudita 🇸🇦", "Uruguay 🇺🇾"],
            "Grupo I": ["Francia 🇫🇷", "Senegal 🇸🇳", "Irak 🇮🇶", "Noruega 🇳🇴"],
            "Grupo J": ["Argentina 🇦🇷", "Argelia 🇩🇿", "Austria 🇦🇹", "Jordania 🇯🇴"],
            "Grupo K": ["Portugal 🇵🇹", "República del Congo 🇨🇬", "Uzbekistán 🇺🇿", "Colombia 🇨🇴"],
            "Grupo L": ["Inglaterra 🏴󠁧󠁢󠁥󠁮󠁧󠁿", "Croacia 🇭🇷", "Ghana 🇬🇭", "Panamá 🇵🇦"]
        };

        let coleccion = {};
        let repetidas = {};
        let lockedColeccion = {};
        let lockedRepetidas = {};

        // === 3. LÓGICA DEL POP-UP ===
        function showModal(type, title, message, confirmCallback = null) {
            const modal = document.getElementById('custom-modal');
            const icon = document.getElementById('modal-icon');
            const btnContainer = document.getElementById('modal-buttons');
            
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            
            if (type === 'success') {
                icon.innerHTML = '<i class="fas fa-check-circle"></i>';
                icon.className = 'modal-icon success';
            } else {
                icon.innerHTML = '<i class="fas fa-exclamation-triangle"></i>';
                icon.className = 'modal-icon warning';
            }
            
            if (confirmCallback) {
                btnContainer.innerHTML = `
                    <button class="modal-btn cancel" onclick="closeModal()">Cancelar</button>
                    <button class="modal-btn" id="confirm-btn">Confirmar</button>
                `;
                document.getElementById('confirm-btn').onclick = function() {
                    closeModal();
                    confirmCallback();
                };
            } else {
                btnContainer.innerHTML = `<button class="modal-btn" onclick="closeModal()">Aceptar</button>`;
            }
            
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.remove('active');
        }

        // === 4. LÓGICA DE FIREBASE Y SINCRONIZACIÓN ===
        function cargarDatosDesdeNube() {
            db.ref('trackers/' + usuarioId).once('value').then((snapshot) => {
                const data = snapshot.val();
                if (data) {
                    coleccion = data.coleccion || {};
                    repetidas = data.repetidas || {};
                    lockedColeccion = data.lockedColeccion || {};
                    lockedRepetidas = data.lockedRepetidas || {};
                }
                // Actualiza visualmente todo una vez que llega de la red
                buildUI();
                updateStats();
            }).catch(error => {
                console.error("Error conectando a Firebase: ", error);
            });
        }

        function saveState() {
            db.ref('trackers/' + usuarioId).update({
                coleccion: coleccion,
                repetidas: repetidas
            });
            updateStats();
        }

        function guardarCategoria(categoria) {
            let hasChanges = false;

            if (categoria === 'coleccion') {
                for (let key in coleccion) {
                    if (coleccion[key] && !lockedColeccion[key]) {
                        lockedColeccion[key] = true;
                        hasChanges = true;
                    }
                }
                if (hasChanges) {
                    db.ref('trackers/' + usuarioId).update({ lockedColeccion: lockedColeccion });
                    showModal('success', '¡Álbum Guardado!', 'Las láminas seleccionadas han sido bloqueadas permanentemente en la nube.');
                    buildUI();
                } else {
                    showModal('warning', 'Sin Novedades', 'No hay selección nueva para guardar en tu álbum.');
                }
            } else {
                for (let key in repetidas) {
                    let minLocked = lockedRepetidas[key] || 0;
                    if (repetidas[key] > minLocked) {
                        lockedRepetidas[key] = repetidas[key];
                        hasChanges = true;
                    }
                }
                if (hasChanges) {
                    db.ref('trackers/' + usuarioId).update({ lockedRepetidas: lockedRepetidas });
                    showModal('success', '¡Repetidas Guardadas!', 'Tus nuevas repetidas han sido guardadas de forma permanente en la nube.');
                    
                    for (let key in repetidas) {
                        const subBtn = document.getElementById(`btn-sub-${key}`);
                        if (subBtn && repetidas[key] <= (lockedRepetidas[key] || 0)) {
                            subBtn.classList.add('locked');
                        }
                    }
                } else {
                    showModal('warning', 'Sin Novedades', 'No hay selección nueva para guardar en repetidas.');
                }
            }
        }

        function confirmarLimpiar(categoria) {
            let hasData = false;

            if (categoria === 'coleccion') {
                hasData = Object.keys(coleccion).length > 0;
            } else {
                for (let key in repetidas) {
                    if (repetidas[key] > 0) {
                        hasData = true;
                        break;
                    }
                }
            }

            if (!hasData) {
                showModal('warning', 'Sin Registros', 'No hay ningún registro que limpiar. Las estadísticas ya están en cero.');
                return;
            }

            showModal('warning', '¿Resetear todo a cero?', 'Se borrarán TODOS los registros en la nube para esta categoría. ¿Continuar?', () => {
                if (categoria === 'coleccion') {
                    coleccion = {}; 
                    lockedColeccion = {};
                    db.ref('trackers/' + usuarioId + '/coleccion').remove();
                    db.ref('trackers/' + usuarioId + '/lockedColeccion').remove();
                } else {
                    repetidas = {};
                    lockedRepetidas = {};
                    db.ref('trackers/' + usuarioId + '/repetidas').remove();
                    db.ref('trackers/' + usuarioId + '/lockedRepetidas').remove();
                }
                saveState(); 
                buildUI();   
                setTimeout(() => showModal('success', 'Reset Completo', 'Todas las selecciones se han reseteado correctamente en la nube.'), 300);
            });
        }

        // === 5. INTERACCIÓN Y UI ===
        function toggleLamina(id) {
            if (lockedColeccion[id]) return;

            if (coleccion[id]) {
                delete coleccion[id];
            } else {
                coleccion[id] = true;
            }
            
            document.getElementById(`lam-${id}`).classList.toggle('pegada');
            saveState();
        }

        function updateRepeat(id, change) {
            const minAllowed = lockedRepetidas[id] || 0;
            if (!repetidas[id]) repetidas[id] = 0;
            
            if (change < 0 && repetidas[id] <= minAllowed) return;

            repetidas[id] += change;
            
            document.getElementById(`rep-count-${id}`).innerText = repetidas[id];
            saveState();

            const subBtn = document.getElementById(`btn-sub-${id}`);
            if (subBtn) {
                if (repetidas[id] <= minAllowed) {
                    subBtn.classList.add('locked');
                } else {
                    subBtn.classList.remove('locked');
                }
            }
        }

        function updateStats() {
            const pegadasCount = Object.keys(coleccion).length;
            let faltantesCount = TOTAL_ALBUM - pegadasCount;
            if(faltantesCount < 0) faltantesCount = 0; 
            
            let percent = (pegadasCount / TOTAL_ALBUM) * 100;
            if(percent > 100) percent = 100;

            let totalRepetidas = 0;
            for (const key in repetidas) {
                totalRepetidas += repetidas[key];
            }

            document.getElementById('pegadas').innerText = pegadasCount;
            document.getElementById('faltantes').innerText = faltantesCount;
            document.getElementById('porcentaje').innerText = percent.toFixed(1) + '%';
            document.getElementById('total-repetidas').innerText = totalRepetidas;
        }

        function switchTab(tabId, element) {
            document.querySelectorAll('.section-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
            
            ejecutarBuscador();
        }

        function ejecutarBuscador() {
            const removeAccents = (str) => {
                return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            };

            const inputRaw = document.getElementById('search-input').value.toLowerCase();
            const input = removeAccents(inputRaw);
            
            const activeSection = document.querySelector('.section-content.active');
            const accordions = activeSection.querySelectorAll('.accordion');

            accordions.forEach(acc => {
                const textContent = removeAccents(acc.innerText.toLowerCase());
                if (textContent.includes(input)) {
                    acc.style.display = 'block'; 
                    if (input.trim() !== '') {
                        acc.classList.add('open'); 
                    } else {
                        acc.classList.remove('open'); 
                    }
                } else {
                    acc.style.display = 'none'; 
                }
            });
        }

        function toggleAccordion(el) {
            el.parentElement.classList.toggle('open');
        }

        function buildUI() {
            const colContainer = document.getElementById('coleccion');
            const repContainer = document.getElementById('repetidas');
            
            colContainer.innerHTML = '';
            repContainer.innerHTML = '';
            
            const createSection = (title, contentCol, contentRep) => {
                const accCol = `
                    <div class="accordion">
                        <div class="accordion-header" onclick="toggleAccordion(this)">
                            ${title} <span class="icon">▼</span>
                        </div>
                        <div class="accordion-body"><div class="grid">${contentCol}</div></div>
                    </div>`;
                const accRep = `
                    <div class="accordion">
                        <div class="accordion-header" onclick="toggleAccordion(this)">
                            ${title} <span class="icon">▼</span>
                        </div>
                        <div class="accordion-body"><div class="grid-rep">${contentRep}</div></div>
                    </div>`;
                colContainer.innerHTML += accCol;
                repContainer.innerHTML += accRep;
            };

            let espCol = '', espRep = '';
            especiales.forEach(esp => {
                const id = esp.replace(/\s+/g, '-');
                const isPegada = coleccion[id] ? 'pegada' : '';
                const isLockedCol = lockedColeccion[id] ? 'locked' : '';
                
                const repVal = repetidas[id] || 0;
                const minLocked = lockedRepetidas[id] || 0;
                const isSubLocked = repVal <= minLocked ? 'locked' : '';
                
                espCol += `<div id="lam-${id}" class="lamina ${isPegada} ${isLockedCol}" onclick="toggleLamina('${id}')">${esp}</div>`;
                
                espRep += `
                    <div class="rep-item">
                        <div class="rep-name">${esp}</div>
                        <div class="controls">
                            <button id="btn-sub-${id}" class="btn-ctrl sub ${isSubLocked}" onclick="updateRepeat('${id}', -1)">-</button>
                            <span class="rep-count" id="rep-count-${id}">${repVal}</span>
                            <button class="btn-ctrl add" onclick="updateRepeat('${id}', 1)">+</button>
                        </div>
                    </div>`;
            });
            createSection('🌟 Especiales', espCol, espRep);

            for (const [grupo, paises] of Object.entries(grupos)) {
                let grpCol = '', grpRep = '';
                
                paises.forEach(pais => {
                    grpCol += `<div class="country-title">${pais}</div>`;
                    grpRep += `<div class="country-title">${pais}</div>`;
                    
                    for (let i = 1; i <= 20; i++) {
                        const id = `${pais.split(' ')[0]}-${i}`;
                        const isPegada = coleccion[id] ? 'pegada' : '';
                        const isLockedCol = lockedColeccion[id] ? 'locked' : '';
                        const isHolo = i === 1 ? 'holo' : '';
                        
                        const repVal = repetidas[id] || 0;
                        const minLocked = lockedRepetidas[id] || 0;
                        const isSubLocked = repVal <= minLocked ? 'locked' : '';
                        
                        const label = i === 1 ? '★ 1' : i;

                        grpCol += `<div id="lam-${id}" class="lamina ${isHolo} ${isPegada} ${isLockedCol}" onclick="toggleLamina('${id}')">${label}</div>`;
                        
                        grpRep += `
                            <div class="rep-item">
                                <div class="rep-name ${isHolo ? 'holo-text' : ''}">${label}</div>
                                <div class="controls">
                                    <button id="btn-sub-${id}" class="btn-ctrl sub ${isSubLocked}" onclick="updateRepeat('${id}', -1)">-</button>
                                    <span class="rep-count" id="rep-count-${id}">${repVal}</span>
                                    <button class="btn-ctrl add" onclick="updateRepeat('${id}', 1)">+</button>
                                </div>
                            </div>`;
                    }
                });
                createSection(`⚽ ${grupo}`, grpCol, grpRep);
            }

            let ccCol = '', ccRep = '';
            cocaCola.forEach(cc => {
                const id = cc.replace(/\s+/g, '-');
                const isPegada = coleccion[id] ? 'pegada' : '';
                const isLockedCol = lockedColeccion[id] ? 'locked' : '';
                
                const repVal = repetidas[id] || 0;
                const minLocked = lockedRepetidas[id] || 0;
                const isSubLocked = repVal <= minLocked ? 'locked' : '';
                
                ccCol += `<div id="lam-${id}" class="lamina ${isPegada} ${isLockedCol}" onclick="toggleLamina('${id}')">${cc}</div>`;
                
                ccRep += `
                    <div class="rep-item">
                        <div class="rep-name">${cc}</div>
                        <div class="controls">
                            <button id="btn-sub-${id}" class="btn-ctrl sub ${isSubLocked}" onclick="updateRepeat('${id}', -1)">-</button>
                            <span class="rep-count" id="rep-count-${id}">${repVal}</span>
                            <button class="btn-ctrl add" onclick="updateRepeat('${id}', 1)">+</button>
                        </div>
                    </div>`;
            });
            createSection('🥤 Láminas Coca Cola', ccCol, ccRep);

            colContainer.innerHTML += `
                <div class="action-btns-container">
                    <button class="btn-action btn-clear" onclick="confirmarLimpiar('coleccion')">🗑️ Resetear Álbum</button>
                    <button class="btn-action btn-save" onclick="guardarCategoria('coleccion')">💾 Guardar Selección</button>
                </div>`;
                
            repContainer.innerHTML += `
                <div class="action-btns-container">
                    <button class="btn-action btn-clear" onclick="confirmarLimpiar('repetidas')">🗑️ Resetear Repetidas</button>
                    <button class="btn-action btn-save" onclick="guardarCategoria('repetidas')">💾 Guardar Repetidas</button>
                </div>`;

            ejecutarBuscador();
        }

        // === 6. ARRANQUE DEL SISTEMA ===
        // 1. Dibujamos la estructura base para que no haya parpadeo blanco (0ms)
        buildUI();
        updateStats();
        // 2. Pedimos los datos a la nube para actualizar la interfaz en cuanto lleguen
        cargarDatosDesdeNube();

    </script>
</body>
</html>
